name: CI

on:
  pull_request:
    branches:
      - main
      - develop

# 同じPRへ続けてpushした場合は、古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Database policies and publication rules
        run: npm run test:db

      - name: Public and CMS HTTP tests
        run: |
          npm run test:api
          npm run test:cms
          npm run test:submissions
          npm run test:scans
          npm run test:comparisons
