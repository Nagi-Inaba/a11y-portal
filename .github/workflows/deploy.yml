name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 本番への反映が重ならないようにする。実行中のものは中断せず順番に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # DBスキーマを先に反映してからアプリを配信する。
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Management APIは使わず、接続文字列でDBへ直接つなぐ。`supabase link`が不要になり、
      # アクセストークンも持たせずに済む。権限はDBユーザーの範囲に限定される。
      #
      # 接続先はSession pooler（5432）。`db.<ref>.supabase.co`はAAAAレコードしか持たず、
      # GitHub ActionsのランナーはIPv4のみのため、直接接続では名前解決できない。
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

  deploy:
    name: Production deploy
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### 本番デプロイ完了"
            echo ""
            echo "- 公開URL: https://a11y-portal.vercel.app"
            echo "- デプロイURL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
